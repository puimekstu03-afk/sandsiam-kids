  <!-- ===== Scene: the cartoon backdrop, pagoda and decorations are drawn on this canvas ===== -->
  <section class="stage" aria-label="SANDSIAM">
    <canvas id="scene" width="1400" height="1000" tabindex="0"></canvas>
    <div class="stage-shade" aria-hidden="true"></div>
    <!-- Intro sky: fireworks (js/kids/intro-fx.js). Tap the scene to send one up. -->
    <canvas id="introFx" class="intro-fx" aria-hidden="true"></canvas>

    <p class="scene-note" data-t="canvasHint"></p>

    <!-- Palette for the piece the child has chosen on the scene -->
    <div id="pickPalette" class="pick-palette" hidden></div>

    <!-- The guide character: a little sand pagoda that gives one tip per step -->
    <button id="guide" class="guide" type="button" hidden>
      <!-- The face stays put; talking frames show on top of it only once they have loaded. -->
      <span class="guide-face">
        <img id="guideImage" src="assets/guide/mascot-point.png" alt="">
        <img id="guideMouth" class="guide-mouth" src="assets/guide/mascot-point.png" alt="" hidden>
      </span>
      <span id="guideText" class="guide-bubble"></span>
    </button>

    <div id="stickerPop" class="sticker-pop" hidden aria-live="polite">
      <img id="stickerPopImage" alt="">
      <p id="stickerPopText"></p>
    </div>

    <button id="delete" class="delete-btn" type="button" hidden></button>
    <button id="flip" class="delete-btn flip-btn" type="button" hidden></button>

    <!-- Layers (step 3): every piece front to back, with the pagoda as one row.
         On phones app.js moves this into the panel, above the footer. -->
    <section id="layers" class="layers" hidden aria-labelledby="layersTitle">
      <div class="layers-head">
        <h2 class="layers-title"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg><span id="layersTitle"></span></h2>
        <button id="layersToggle" class="layers-toggle" type="button" aria-controls="layersBody">
          <svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>
        </button>
      </div>
      <div id="layersBody" class="layers-body">
        <p id="layersHint" class="layers-hint"></p>
        <p class="layers-end"><svg class="icon" aria-hidden="true"><use href="#i-chevrons-up"/></svg><span data-t="layersFront"></span></p>
        <ol id="layersList" class="layers-list"></ol>
        <p class="layers-end"><svg class="icon" aria-hidden="true"><use href="#i-chevrons-down"/></svg><span data-t="layersBack"></span></p>
        <div id="layerControls" class="layer-controls" hidden></div>
      </div>
    </section>

    <div class="stage-tools" role="toolbar">
      <button id="undo" class="tool-btn" type="button">
        <svg aria-hidden="true"><use href="#i-undo"/></svg>
        <span class="tool-label" data-t="undoShort"></span>
      </button>
      <button id="redo" class="tool-btn" type="button">
        <svg aria-hidden="true"><use href="#i-redo"/></svg>
        <span class="tool-label" data-t="redoShort"></span>
      </button>
      <!-- Zoom is kept for keyboard users but hidden: children don't need it. -->
      <i class="tool-sep" hidden></i>
      <button id="zoomOut" class="tool-btn" type="button" hidden>
        <svg aria-hidden="true"><use href="#i-minus"/></svg>
      </button>
      <button id="zoomReset" class="tool-btn tool-zoom" type="button" hidden>100%</button>
      <button id="zoomIn" class="tool-btn" type="button" hidden>
        <svg aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </div>
  </section>

  <!-- ===== Top bar over the scene ===== -->
  <header class="topbar">
    <div class="topbar-icons">
      <button id="home" class="icon-btn" type="button">
        <svg aria-hidden="true"><use href="#i-home"/></svg>
      </button>
      <button id="help" class="icon-btn" type="button">
        <svg aria-hidden="true"><use href="#i-help"/></svg>
      </button>
      <label class="icon-btn lang-btn">
        <svg aria-hidden="true"><use href="#i-globe"/></svg>
        <select id="language">
          <option value="th">ไทย</option>
          <option value="en">EN</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>
    <div class="topbar-right">
      <button id="music" class="icon-btn" type="button">
        <svg class="icon-music-on" aria-hidden="true"><use href="#i-music"/></svg>
        <svg class="icon-music-off" aria-hidden="true"><use href="#i-music-off"/></svg>
      </button>
      <button id="sound" class="icon-btn" type="button">
        <svg class="icon-sound-on" aria-hidden="true"><use href="#i-sound"/></svg>
        <svg class="icon-sound-off" aria-hidden="true"><use href="#i-sound-off"/></svg>
      </button>
      <button id="player" class="icon-btn player-btn" type="button">
        <svg aria-hidden="true"><use href="#i-user"/></svg>
        <span id="playerName"></span>
      </button>
      <a class="wordmark wordmark-light" href="./" aria-label="SANDSIAM"><span>S</span><span>A</span><span>N</span><span>D</span><span>S</span><span>I</span><span>A</span><span>M</span></a>
    </div>
  </header>

  <!-- ===== Intro ===== -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="splash">
      <img class="splash-flower splash-flower-a" src="assets/ornaments/marigold.webp" alt="">
      <img class="splash-flower splash-flower-b" src="assets/ornaments/plumeria.webp" alt="">
      <img class="splash-flower splash-flower-c" src="assets/ornaments/lotus.webp" alt="">
      <svg class="splash-sparkle splash-sparkle-a" aria-hidden="true"><use href="#i-twinkle"/></svg>
      <svg class="splash-sparkle splash-sparkle-b" aria-hidden="true"><use href="#i-twinkle"/></svg>
      <svg class="splash-sparkle splash-sparkle-c" aria-hidden="true"><use href="#i-twinkle"/></svg>
      <p class="splash-brand" aria-hidden="true"><span>S</span><span>A</span><span>N</span><span>D</span><span>S</span><span>I</span><span>A</span><span>M</span></p>
      <h1 id="heroTitle" class="hero-title">
        <span data-t="heroTitle"></span>
        <span class="hero-title-accent" data-t="heroTitle2"></span>
      </h1>
    </div>
    <p class="counter" aria-live="polite">
      <svg class="icon icon-star" aria-hidden="true"><use href="#i-star"/></svg>
      <span id="counterBefore"></span>
      <b id="counterValue">0</b>
      <span id="counterAfter"></span>
    </p>
  </section>

  <div class="intro-bottom">
    <!-- Five regional traditions; the intro photo cycles through them -->
    <nav class="regions" aria-label="Regions">
      <div id="regions" class="regions-list"></div>
      <p id="regionCaption" class="regions-caption"></p>
    </nav>
    <div class="hero-actions">
      <button id="start" class="btn-gold btn-hero" type="button" data-t="startNew"></button>
      <button id="openField" class="btn-white btn-hero" type="button" data-t="viewField"></button>
    </div>
    <button id="resume" class="resume-link" type="button" hidden></button>
  </div>

  <footer class="site-footer">
    <span>© 2026 SANDSIAM · <span data-t="footer"></span></span>
  </footer>

  <!-- ===== Editor panel (five steps) ===== -->
  <aside class="panel editor" aria-labelledby="panelTitle">
    <div class="panel-head">
      <a class="wordmark" href="./" aria-label="SANDSIAM"><span>S</span><span>A</span><span>N</span><span>D</span><span>S</span><span>I</span><span>A</span><span>M</span></a>
      <nav id="steps" class="steps" aria-label="Progress"></nav>
    </div>
    <div class="editor-head">
      <h2 id="panelTitle"></h2>
      <p id="panelDesc"></p>
    </div>
    <div id="panel" class="editor-body"></div>
    <div class="editor-foot">
      <button id="back" class="btn-ghost" type="button" data-t="back"></button>
      <button id="next" class="btn-gold" type="button"></button>
    </div>
  </aside>

  <!-- ===== Celebration & share panel ===== -->
  <section id="shareView" class="panel share-view" aria-labelledby="shareTitle">
    <div class="panel-head">
      <a class="wordmark" href="./" aria-label="SANDSIAM"><span>S</span><span>A</span><span>N</span><span>D</span><span>S</span><span>I</span><span>A</span><span>M</span></a>
    </div>
    <div class="share-body">
      <p id="shareChip" class="share-place"></p>
      <h2 id="shareTitle"></h2>
      <p id="shareBy" class="share-by"></p>
      <figure class="share-wish">
        <blockquote id="shareWish"></blockquote>
        <figcaption id="shareName"></figcaption>
      </figure>

      <p id="shareKids" class="share-kids"></p>
      <div id="shareIcons" class="share-icons" hidden>
        <p class="share-to" data-t="shareTo"></p>
        <div class="share-row">
          <a id="shareLine" class="social-btn social-line" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C7 4 3 7.2 3 11.1c0 3.5 3.1 6.4 7.4 7l-.5 2.4c-.1.4.3.7.7.5 2.7-1.5 6.9-4.2 8.6-6.6.9-1.1 1.3-2.2 1.3-3.3C20.5 7.2 17 4 12 4Z"/></svg>
          </a>
          <a id="shareFacebook" class="social-btn social-facebook" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 8H17V4.5h-2.5C12 4.5 10.5 6 10.5 8.5V10H8v3.5h2.5V21H14v-7.5h2.6L17 10h-3V8.6c0-.4.2-.6.5-.6Z"/></svg>
          </a>
          <a id="shareX" class="social-btn social-x" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 16M19 4 5 20"/></svg>
          </a>
          <button id="shareCopy" class="social-btn social-copy" type="button">
            <svg aria-hidden="true"><use href="#i-link"/></svg>
          </button>
        </div>
        <input id="shareField" class="input share-field" type="text" readonly hidden aria-label="Link">
      </div>
    </div>
    <div class="editor-foot share-actions">
      <button id="shareMain" class="btn-gold" type="button"></button>
      <button id="shareBack" class="btn-ghost" type="button"></button>
      <button id="shareToField" class="btn-ghost" type="button" data-t="viewField"></button>
      <button id="shareReplay" class="btn-ghost" type="button"></button>
    </div>
  </section>

  <!-- ===== Pagoda field ===== -->
  <section id="fieldView" class="panel field-view" aria-labelledby="fieldTitle">
    <div class="panel-head">
      <a class="wordmark" href="./" aria-label="SANDSIAM"><span>S</span><span>A</span><span>N</span><span>D</span><span>S</span><span>I</span><span>A</span><span>M</span></a>
    </div>
    <div class="field-body">
      <h2 id="fieldTitle" data-t="fieldTitle"></h2>
      <p class="field-desc" data-t="fieldDesc"></p>
      <p class="field-total"><svg class="icon icon-star" aria-hidden="true"><use href="#i-star"/></svg><span id="fieldTotal"></span></p>
      <div id="fieldRegions" class="field-regions" role="tablist"></div>
      <nav id="fieldPages" class="field-pages" hidden></nav>
      <div id="fieldCard" class="field-card" aria-live="polite"></div>
      <div id="fieldReviews" class="field-reviews" hidden></div>
      <p id="fieldNote" class="fine-print"></p>
    </div>
    <div class="editor-foot">
      <button id="fieldBuild" class="btn-gold" type="button" data-t="startNew"></button>
      <button id="fieldHome" class="btn-ghost" type="button" data-t="home"></button>
    </div>
  </section>

  <div id="toast" role="status"></div>

  <!-- ===== How to play ===== -->
  <dialog id="helpDialog" class="modal howto">
    <button class="modal-close" type="button">
      <svg aria-hidden="true"><use href="#i-x"/></svg>
    </button>
    <p class="modal-kicker">SANDSIAM</p>
    <h2 data-t="howToTitle"></h2>
    <ol class="howto-steps">
      <li>
        <span class="howto-art"><img src="assets/guide/mascot-point.png" alt=""></span>
        <span data-howto="0"></span>
      </li>
      <li>
        <span class="howto-art howto-drag" aria-hidden="true">
          <img class="howto-flag" src="assets/ornaments/flag.webp" alt="">
          <span class="howto-finger"></span>
        </span>
        <span data-howto="1"></span>
      </li>
      <li>
        <span class="howto-art"><img src="assets/guide/mascot-cheer.png" alt=""></span>
        <span data-howto="2"></span>
      </li>
    </ol>
    <button class="btn-gold btn-block btn-big close-help" type="button" data-t="gotIt"></button>
    <details class="teacher-notes">
      <summary data-t="teacherTitle"></summary>
      <p data-t="teacherText"></p>
      <p class="modal-note" data-t="tradition"></p>
      <button id="teacherCopy" class="btn-ghost btn-block" type="button" data-t="teacherShare"></button>
      <input id="teacherLink" class="input share-field" type="text" readonly hidden aria-label="Link">
    </details>
  </dialog>

  <!-- ===== Who's playing? (shared classroom computers) ===== -->
  <dialog id="playerDialog" class="modal players">
    <h2 class="with-icon"><svg class="icon" aria-hidden="true"><use href="#i-hand"/></svg><span id="playerTitle"></span></h2>
    <div id="playerList" class="player-list"></div>
    <form id="newPlayerForm" class="player-new">
      <label id="newPlayerLabel" for="newPlayerName"></label>
      <div class="player-new-row">
        <input id="newPlayerName" class="input" type="text" maxlength="20" autocomplete="off">
        <button id="newPlayerGo" class="btn-gold" type="submit"></button>
      </div>
    </form>
    <p id="playerNote" class="fine-print"></p>
  </dialog>

  <!-- Scripts are plain (no build step) and must load in this order. -->
  <!-- Data -->
  <script src="js/data/i18n.js?v=9"></script>
  <script src="js/data/map-data.js"></script>
  <!-- Scene drawing (Canvas 2D, no DOM) -->
  <script src="js/scene/core.js"></script>
  <script src="js/scene/assets.js"></script>
  <!-- Cartoon decorations: the catalogue, then loading and recolouring their pictures -->
  <script src="js/scene/ornaments/catalog.js"></script>
  <script src="js/scene/ornaments/pictures.js"></script>
  <script src="js/scene/backgrounds.js"></script>
  <script src="js/scene/decorations.js?v=2"></script>
  <script src="js/scene/pagoda.js"></script>
  <script src="js/scene/effects.js"></script>
  <script src="js/scene/render.js"></script>
  <script src="js/scene/field.js?v=2"></script>
  <!-- Helpers for young players -->
  <script src="js/kids/players.js"></script>
  <script src="js/kids/sound.js?v=2"></script>
  <script src="js/kids/music.js?v=3"></script>
  <script src="js/kids/intro-fx.js?v=2"></script>
  <script src="js/kids/polite.js"></script>
  <script src="js/kids/stickers.js"></script>
  <!-- Pagoda field storage -->
  <script src="js/store/local-store.js?v=2"></script>
  <script src="js/store/shared-store.js?v=2"></script>
  <script src="js/store/supabase-store.js?v=4"></script>
  <script src="js/store/field-store.js?v=5"></script>
  <!-- The app -->
  <script src="js/app/config.js"></script>
  <script src="js/app/state.js?v=2"></script>
  <script src="js/app/layers.js"></script>
  <script src="js/app/main.js?v=13"></script>
</body>
</html>
