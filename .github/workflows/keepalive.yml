# Keeps the free Supabase project awake (it pauses after 7 days with no visitors).
# Works once this folder is pushed to a GitHub repository: GitHub runs it every 3 days.
name: Keep the pagoda field awake
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/keepalive.sh
